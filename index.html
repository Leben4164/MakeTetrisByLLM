<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웹 테트리스 게임</title>
  <style>
    body {
      background-color: #202028;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    #game-container {
      display: flex;
      gap: 20px;
    }

    canvas {
      background-color: #000;
      border: 2px solid #333;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    .score-board {
      display: flex;
      flex-direction: column;
      font-size: 24px;
    }
  </style>
</head>

<body>
  <h1>TETRIS</h1>
  <div id="game-container">
    <!-- 테트리스 게임이 그려질 캔버스 (가로 10칸, 세로 20칸 비율) -->
    <canvas id="tetris" width="300" height="600"></canvas>

    <div class="score-board">
      <div>점수: <span id="score">0</span></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');

    // 캔버스의 크기를 블록 단위로 스케일링 (1블록 = 30px)
    context.scale(30, 30);

    // 1. 7가지 테트로미노 색상 정의
    // 인덱스 번호(1~7)와 모양 행렬의 숫자가 일치하도록 설정합니다.
    const colors = [
      null,
      '#FF0D72', // 1: T (분홍)
      '#0DC2FF', // 2: I (하늘)
      '#0DFF72', // 3: S (연두)
      '#F538FF', // 4: Z (보라)
      '#FF8E0D', // 5: L (주황)
      '#FFE138', // 6: J (노랑)
      '#3877FF'  // 7: O (파랑)
    ];

    // 2. 테트로미노 모양(행렬) 생성 함수
    function createPiece(type) {
      if (type === 'T') {
        return [
          [0, 1, 0],
          [1, 1, 1],
          [0, 0, 0],
        ];
      } else if (type === 'I') {
        return [
          [0, 2, 0, 0],
          [0, 2, 0, 0],
          [0, 2, 0, 0],
          [0, 2, 0, 0],
        ];
      } else if (type === 'S') {
        return [
          [0, 3, 3],
          [3, 3, 0],
          [0, 0, 0],
        ];
      } else if (type === 'Z') {
        return [
          [4, 4, 0],
          [0, 4, 4],
          [0, 0, 0],
        ];
      } else if (type === 'L') {
        return [
          [0, 5, 0],
          [0, 5, 0],
          [0, 5, 5],
        ];
      } else if (type === 'J') {
        return [
          [0, 6, 0],
          [0, 6, 0],
          [6, 6, 0],
        ];
      } else if (type === 'O') {
        return [
          [7, 7],
          [7, 7],
        ];
      }
    }

    // 3. 블록을 화면(캔버스)에 그리는 함수
    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          // 값이 0이 아닐 때만 색칠합니다.
          if (value !== 0) {
            context.fillStyle = colors[value];
            // offset은 블록이 그려질 기준 좌표(x, y)입니다.
            context.fillRect(x + offset.x, y + offset.y, 1, 1);

            // 블록의 테두리를 그려서 구분을 명확하게 합니다.
            context.lineWidth = 0.05;
            context.strokeStyle = 'black';
            context.strokeRect(x + offset.x, y + offset.y, 1, 1);
          }
        });
      });
    }

    // 4. 플레이어 정보 (비워둠)
    const player = {
      pos: { x: 0, y: 0 },
      matrix: null, // 이제 고정된 블록 대신 랜덤으로 채워집니다.
    };

    // 5. 게임 보드(아레나) 생성 함수 (가로 10, 세로 20 크기의 0으로 채워진 배열)
    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }
    const arena = createMatrix(10, 20);

    // 6. 충돌 감지 함수
    function collide(arena, player) {
      const [m, o] = [player.matrix, player.pos];
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          // 1. 블록의 칠해진 부분(0이 아닌 값)이
          // 2. 게임 보드(아레나) 범위를 벗어나거나
          // 3. 게임 보드에 이미 칠해진 부분과 겹치는지 확인
          if (m[y][x] !== 0 &&
            (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    // 7. 블록을 게임 보드(아레나)에 고정시키는 함수
    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    // 8. 화면을 다시 그리는 함수 (아레나와 플레이어를 함께 그림)
    function draw() {
      context.fillStyle = '#000';
      context.fillRect(0, 0, canvas.width, canvas.height);

      drawMatrix(arena, { x: 0, y: 0 }); // 바닥에 쌓인 블록들 그리기
      drawMatrix(player.matrix, player.pos); // 현재 떨어지는 블록 그리기
    }

    // 9. 수정된 플레이어 이동 함수
    function playerMove(dir) {
      player.pos.x += dir;
      // 이동했는데 충돌했다면, 다시 원래 위치로 되돌림 (벽에 막힘)
      if (collide(arena, player)) {
        player.pos.x -= dir;
      }
    }

    // 10. 수정된 플레이어 하강 함수 (랜덤 블록 생성 적용)
    function playerDrop() {
      player.pos.y += 1;
      // 아래로 내려갔는데 충돌했다면
      if (collide(arena, player)) {
        player.pos.y -= 1;
        merge(arena, player);

        // 블록이 고정되면 새로운 랜덤 블록을 뽑아옵니다!
        playerReset();
      }
      dropCounter = 0;
    }

    // 11. 행렬을 90도 회전시키는 함수
    function rotate(matrix, dir) {
      // 1) 대각선을 기준으로 값의 위치를 서로 바꿈 (Transpose)
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [
            matrix[x][y],
            matrix[y][x],
          ] = [
              matrix[y][x],
              matrix[x][y],
            ];
        }
      }
      // 2) 방향(시계방향)에 따라 각 줄의 순서를 뒤집음 (Reverse)
      if (dir > 0) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    // 12. 플레이어 회전 함수 (벽면 충돌 보정 기능 포함)
    function playerRotate(dir) {
      const pos = player.pos.x;
      let offset = 1;

      // 일단 블록을 회전시킵니다.
      rotate(player.matrix, dir);

      // 회전시켰는데 벽이나 다른 블록과 겹친다면? (충돌 감지)
      while (collide(arena, player)) {
        // 블록을 좌우로 조금씩 밀어보며 겹치지 않는 공간을 찾습니다. (Wall Kick)
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));

        // 밀어봐도 공간이 없다면 회전을 취소하고 원래 상태로 되돌립니다.
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    // 13. 수정된 키보드 이벤트 리스너 추가
    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') {
        playerMove(-1);
      } else if (event.key === 'ArrowRight') {
        playerMove(1);
      } else if (event.key === 'ArrowDown') {
        playerDrop();
      } else if (event.key === 'ArrowUp') {
        // 위쪽 화살표를 누르면 시계 방향(1)으로 회전
        playerRotate(1);
      }
    });

    // 14. 새로운 블록을 랜덤하게 생성하는 함수
    function playerReset() {
      const pieces = 'ILJOTSZ';
      // 문자열 길이를 이용해 7가지 중 하나의 문자를 무작위로 뽑음
      const randomPiece = pieces[pieces.length * Math.random() | 0];
      player.matrix = createPiece(randomPiece);

      // 블록을 화면 맨 위, 가운데로 정렬
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) -
        (player.matrix[0].length / 2 | 0);

      // 만약 새 블록이 나오자마자 기존 블록(벽)과 충돌한다면 (게임 오버)
      if (collide(arena, player)) {
        // 게임 보드를 0으로 싹 비워서 게임을 다시 시작합니다.
        arena.forEach(row => row.fill(0));
      }
    }

    // 12. 자동 하강을 위한 시간 변수 설정
    let dropCounter = 0;
    let dropInterval = 1000; // 1000ms = 1초마다 하강
    let lastTime = 0;

    // 13. 게임 루프(Game Loop) 함수
    function update(time = 0) {
      // 지난 번 불렸을 때와 지금의 시간 차이(deltaTime) 계산
      const deltaTime = time - lastTime;
      lastTime = time;

      dropCounter += deltaTime;

      // 1초(1000ms)가 넘게 지났다면 블록을 아래로 한 칸 내림
      if (dropCounter > dropInterval) {
        playerDrop();
      }

      draw(); // 화면 다시 그리기

      // 브라우저에게 다음 프레임에 update 함수를 다시 실행해달라고 요청
      requestAnimationFrame(update);
    }
    // 최초의 게임 시작! 랜덤 블록 하나를 뽑아두고 루프를 켭니다.
    playerReset();
    // 최초의 게임 루프 시작!
    update();
  </script>
</body>

</html>
