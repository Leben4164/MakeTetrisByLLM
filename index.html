<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웹 테트리스 게임</title>
  <style>
    body {
      background-color: #202028;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    #game-container {
      display: flex;
      gap: 20px;
    }

    canvas {
      background-color: #000;
      border: 2px solid #333;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    .score-board {
      display: flex;
      flex-direction: column;
      font-size: 24px;
    }
  </style>
</head>

<body>
  <h1>TETRIS</h1>
  <div id="game-container">
    <!-- 테트리스 게임이 그려질 캔버스 (가로 10칸, 세로 20칸 비율) -->
    <canvas id="tetris" width="300" height="600"></canvas>

    <div class="score-board">
      <div>점수: <span id="score">0</span></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');

    // 캔버스의 크기를 블록 단위로 스케일링 (1블록 = 30px)
    context.scale(30, 30);

    // 1. 7가지 테트로미노 색상 정의
    // 인덱스 번호(1~7)와 모양 행렬의 숫자가 일치하도록 설정합니다.
    const colors = [
      null,
      '#FF0D72', // 1: T (분홍)
      '#0DC2FF', // 2: I (하늘)
      '#0DFF72', // 3: S (연두)
      '#F538FF', // 4: Z (보라)
      '#FF8E0D', // 5: L (주황)
      '#FFE138', // 6: J (노랑)
      '#3877FF'  // 7: O (파랑)
    ];

    // 2. 테트로미노 모양(행렬) 생성 함수
    function createPiece(type) {
      if (type === 'T') {
        return [
          [0, 1, 0],
          [1, 1, 1],
          [0, 0, 0],
        ];
      } else if (type === 'I') {
        return [
          [0, 2, 0, 0],
          [0, 2, 0, 0],
          [0, 2, 0, 0],
          [0, 2, 0, 0],
        ];
      } else if (type === 'S') {
        return [
          [0, 3, 3],
          [3, 3, 0],
          [0, 0, 0],
        ];
      } else if (type === 'Z') {
        return [
          [4, 4, 0],
          [0, 4, 4],
          [0, 0, 0],
        ];
      } else if (type === 'L') {
        return [
          [0, 5, 0],
          [0, 5, 0],
          [0, 5, 5],
        ];
      } else if (type === 'J') {
        return [
          [0, 6, 0],
          [0, 6, 0],
          [6, 6, 0],
        ];
      } else if (type === 'O') {
        return [
          [7, 7],
          [7, 7],
        ];
      }
    }

    // 3. 블록을 화면(캔버스)에 그리는 함수
    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          // 값이 0이 아닐 때만 색칠합니다.
          if (value !== 0) {
            context.fillStyle = colors[value];
            // offset은 블록이 그려질 기준 좌표(x, y)입니다.
            context.fillRect(x + offset.x, y + offset.y, 1, 1);

            // 블록의 테두리를 그려서 구분을 명확하게 합니다.
            context.lineWidth = 0.05;
            context.strokeStyle = 'black';
            context.strokeRect(x + offset.x, y + offset.y, 1, 1);
          }
        });
      });
    }

    // 4. 플레이어 정보 (위치와 모양)
    const player = {
      pos: { x: 3, y: 3 },
      matrix: createPiece('T'),
    };

    // 5. 화면을 다시 그리는 함수
    function draw() {
      // 배경을 까맣게 다시 칠해서 이전 프레임의 블록 흔적을 지웁니다.
      context.fillStyle = '#000';
      context.fillRect(0, 0, canvas.width, canvas.height);

      // 변경된 위치에 블록을 다시 그립니다.
      drawMatrix(player.matrix, player.pos);
    }

    // 6. 플레이어 이동 함수 (좌우)
    function playerMove(dir) {
      player.pos.x += dir;
    }

    // 7. 플레이어 하강 함수 (아래)
    function playerDrop() {
      player.pos.y += 1;
    }

    // 8. 키보드 이벤트 리스너 추가
    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') {
        // 왼쪽 화살표: x좌표를 -1 만큼 이동
        playerMove(-1);
      } else if (event.key === 'ArrowRight') {
        // 오른쪽 화살표: x좌표를 +1 만큼 이동
        playerMove(1);
      } else if (event.key === 'ArrowDown') {
        // 아래 화살표: y좌표를 +1 만큼 이동
        playerDrop();
      }

      // 위치가 변경되었으니 화면을 다시 그립니다.
      draw();
    });

    // 초기 화면 그리기 (게임 시작 시 처음 한 번 실행)
    draw();
  </script>
</body>

</html>
