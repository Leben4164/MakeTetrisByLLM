<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웹 테트리스 게임</title>
  <style>
    body {
      background-color: #202028;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    #game-container {
      display: flex;
      gap: 20px;
    }

    canvas {
      background-color: #000;
      border: 2px solid #333;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    .score-board {
      display: flex;
      flex-direction: column;
      font-size: 24px;
    }
  </style>
</head>

<body>
  <h1>TETRIS</h1>
  <div id="game-container">
    <!-- 테트리스 게임이 그려질 캔버스 (가로 10칸, 세로 20칸 비율) -->
    <canvas id="tetris" width="300" height="600"></canvas>

    <div class="score-board">
      <div>점수: <span id="score">0</span></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');

    // 캔버스의 크기를 블록 단위로 스케일링 (1블록 = 30px)
    context.scale(30, 30);

    // 1. 7가지 테트로미노 색상 정의
    // 인덱스 번호(1~7)와 모양 행렬의 숫자가 일치하도록 설정합니다.
    const colors = [
      null,
      '#FF0D72', // 1: T (분홍)
      '#0DC2FF', // 2: I (하늘)
      '#0DFF72', // 3: S (연두)
      '#F538FF', // 4: Z (보라)
      '#FF8E0D', // 5: L (주황)
      '#FFE138', // 6: J (노랑)
      '#3877FF'  // 7: O (파랑)
    ];

    // 2. 테트로미노 모양(행렬) 생성 함수
    function createPiece(type) {
      if (type === 'T') {
        return [
          [0, 1, 0],
          [1, 1, 1],
          [0, 0, 0],
        ];
      } else if (type === 'I') {
        return [
          [0, 2, 0, 0],
          [0, 2, 0, 0],
          [0, 2, 0, 0],
          [0, 2, 0, 0],
        ];
      } else if (type === 'S') {
        return [
          [0, 3, 3],
          [3, 3, 0],
          [0, 0, 0],
        ];
      } else if (type === 'Z') {
        return [
          [4, 4, 0],
          [0, 4, 4],
          [0, 0, 0],
        ];
      } else if (type === 'L') {
        return [
          [0, 5, 0],
          [0, 5, 0],
          [0, 5, 5],
        ];
      } else if (type === 'J') {
        return [
          [0, 6, 0],
          [0, 6, 0],
          [6, 6, 0],
        ];
      } else if (type === 'O') {
        return [
          [7, 7],
          [7, 7],
        ];
      }
    }

    // 3. 블록을 화면(캔버스)에 그리는 함수
    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          // 값이 0이 아닐 때만 색칠합니다.
          if (value !== 0) {
            context.fillStyle = colors[value];
            // offset은 블록이 그려질 기준 좌표(x, y)입니다.
            context.fillRect(x + offset.x, y + offset.y, 1, 1);

            // 블록의 테두리를 그려서 구분을 명확하게 합니다.
            context.lineWidth = 0.05;
            context.strokeStyle = 'black';
            context.strokeRect(x + offset.x, y + offset.y, 1, 1);
          }
        });
      });
    }

    // 4. 플레이어 정보 (위치와 모양)
    const player = {
      pos: { x: 3, y: 3 },
      matrix: createPiece('T'),
    };

    // 5. 게임 보드(아레나) 생성 함수 (가로 10, 세로 20 크기의 0으로 채워진 배열)
    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }
    const arena = createMatrix(10, 20);

    // 6. 충돌 감지 함수
    function collide(arena, player) {
      const [m, o] = [player.matrix, player.pos];
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          // 1. 블록의 칠해진 부분(0이 아닌 값)이
          // 2. 게임 보드(아레나) 범위를 벗어나거나
          // 3. 게임 보드에 이미 칠해진 부분과 겹치는지 확인
          if (m[y][x] !== 0 &&
            (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    // 7. 블록을 게임 보드(아레나)에 고정시키는 함수
    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    // 8. 화면을 다시 그리는 함수 (아레나와 플레이어를 함께 그림)
    function draw() {
      context.fillStyle = '#000';
      context.fillRect(0, 0, canvas.width, canvas.height);

      drawMatrix(arena, { x: 0, y: 0 }); // 바닥에 쌓인 블록들 그리기
      drawMatrix(player.matrix, player.pos); // 현재 떨어지는 블록 그리기
    }

    // 9. 수정된 플레이어 이동 함수
    function playerMove(dir) {
      player.pos.x += dir;
      // 이동했는데 충돌했다면, 다시 원래 위치로 되돌림 (벽에 막힘)
      if (collide(arena, player)) {
        player.pos.x -= dir;
      }
    }

    // 10. 수정된 플레이어 하강 함수
    function playerDrop() {
      player.pos.y += 1;
      // 아래로 내려갔는데 충돌했다면 (바닥이나 다른 블록에 닿음)
      if (collide(arena, player)) {
        player.pos.y -= 1;     // 다시 위로 한 칸 올리고
        merge(arena, player);  // 아레나에 현재 블록을 영구적으로 고정

        // 블록이 바닥에 닿았으니 위치를 맨 위로 초기화 (임시 조치)
        player.pos.y = 0;
        player.pos.x = 3;
      }
    }

    // 11. 키보드 이벤트 리스너 추가
    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') {
        playerMove(-1);
      } else if (event.key === 'ArrowRight') {
        playerMove(1);
      } else if (event.key === 'ArrowDown') {
        playerDrop();
      }
      draw();
    });

    // 초기 화면 그리기
    draw();
  </script>
</body>

</html>
